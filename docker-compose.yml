version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: techno-re-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-techno}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-techno_re}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-techno}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: techno-re-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techno-re-server
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgresql://techno:password@postgres:5432/techno_re?sslmode=disable}
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      CACHE_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: techno-re-network